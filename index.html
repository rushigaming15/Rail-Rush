<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rail Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one full-height stage, a portrait canvas fitted to the free space, a hint row beneath.
   Single dusk-platform look by choice, so no light/dark pair. */
:root {
  --night: #120c1e;
  --dusk: #2a1840;
  --glow: #ff8a3d;
  --signal: #ffd23f;
  --board: #1f3a6e;
  --cream: #f3ead8;
  --muted: #b9a9d0;
  --font-display: 'Bungee', Impact, 'Arial Black', sans-serif;
  --font-body: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--night); }
body {
  height: 100%;
  box-sizing: border-box;
  background: var(--night);
  color: var(--cream);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  overflow: hidden;
}
.stage {
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
#c {
  display: block;
  flex: none;
  border-radius: 14px;
  background: var(--dusk);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .55);
}
.hint {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 4px 14px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
}
.hint button {
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  color: var(--cream);
  background: var(--board);
  border: 2px solid var(--cream);
  border-radius: 6px;
  padding: 2px 12px;
  cursor: pointer;
}
.hint button:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
</style>

<div class="stage">
  <canvas id="c" aria-label="Rail Rush game. Arrow keys or swipe to move, jump and slide."></canvas>
  <div class="hint" id="hint">
    <span>&larr; &rarr; track &middot; &uarr; jump &middot; &darr; slide &middot; swipe on phone</span>
    <button id="snd" type="button">Sound on</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const W = 420, H = 760, HZ = 250, F = 306, CAMH = 6, ZP = 5, LANE = 2, FAR = 95, NEAR = 1.6;
  const DISPLAY = '"Bungee", Impact, "Arial Black", sans-serif';
  const BODY = '"Barlow Condensed", "Arial Narrow", Arial, sans-serif';

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr;
  cv.height = H * dpr;
  if (!ctx.roundRect) ctx.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };

  const stage = document.querySelector('.stage');
  const hint = document.getElementById('hint');
  function fit() {
    const aw = stage.clientWidth;
    const ah = stage.clientHeight - hint.offsetHeight - 10;
    const s = Math.max(0.3, Math.min(aw / W, ah / H));
    cv.style.width = Math.floor(W * s) + 'px';
    cv.style.height = Math.floor(H * s) + 'px';
  }
  addEventListener('resize', fit);
  fit();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('26px Bungee');
    document.fonts.load('600 18px "Barlow Condensed"');
    document.fonts.ready.then(fit);
  }

  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- helpers ---------- */
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function proj(x, y, z) { const k = F / z; return [W / 2 + x * k, HZ + (CAMH - y) * k]; }
  function poly(pts, fill) {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const p = proj(pts[i][0], pts[i][1], pts[i][2]);
      if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]);
    }
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  }

  /* ---------- sound ---------- */
  let ac = null, muted = false;
  const sndBtn = document.getElementById('snd');
  function beep(freq, dur, type, vol, to) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, n);
      if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
      g.gain.setValueAtTime(vol || 0.05, n);
      g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(n); o.stop(n + dur);
    } catch (e) { /* audio is optional */ }
  }
  sndBtn.addEventListener('click', () => {
    muted = !muted;
    sndBtn.textContent = muted ? 'Sound off' : 'Sound on';
  });

  /* ---------- static scenery (drawn once) ---------- */
  let seed = 7;
  const srand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const skyline = document.createElement('canvas');
  const SKY_W = W + 120, SKY_H = 100;
  skyline.width = SKY_W * dpr; skyline.height = SKY_H * dpr;
  (function buildSkyline() {
    const s = skyline.getContext('2d');
    s.scale(dpr, dpr);
    [['#4a2457', 22, 40], ['#241338', 20, 62]].forEach((layer, li) => {
      let x = -10;
      while (x < SKY_W) {
        const w = 16 + srand() * 30, h = layer[1] + srand() * layer[2];
        s.fillStyle = layer[0];
        s.fillRect(x, SKY_H - h, w, h);
        if (li === 1) {
          for (let wy = SKY_H - h + 6; wy < SKY_H - 4; wy += 9) {
            for (let wx = x + 4; wx < x + w - 5; wx += 8) {
              if (srand() < 0.12) { s.fillStyle = '#ffcf7a'; s.fillRect(wx, wy, 3, 4); }
            }
          }
        }
        x += w + srand() * 4;
      }
    });
  })();
  const stars = Array.from({ length: 46 }, () => ({ x: srand() * W, y: srand() * HZ * 0.55, a: 0.3 + srand() * 0.6, r: srand() < 0.15 ? 1.6 : 1 }));
  const skyGrad = ctx.createLinearGradient(0, 0, 0, HZ);
  skyGrad.addColorStop(0, '#120c2a'); skyGrad.addColorStop(0.55, '#4b2260');
  skyGrad.addColorStop(0.86, '#c2476a'); skyGrad.addColorStop(1, '#ff9a4a');
  const groundGrad = ctx.createLinearGradient(0, HZ, 0, H);
  groundGrad.addColorStop(0, '#3a2540'); groundGrad.addColorStop(1, '#150f1d');
  const sunGrad = ctx.createRadialGradient(W * 0.68, HZ - 28, 6, W * 0.68, HZ - 28, 78);
  sunGrad.addColorStop(0, '#fff0b8'); sunGrad.addColorStop(0.45, '#ffb15a'); sunGrad.addColorStop(1, 'rgba(255,122,69,0)');
  const fogGrad = ctx.createLinearGradient(0, HZ - 2, 0, HZ + 90);
  fogGrad.addColorStop(0, 'rgba(255,150,80,.55)'); fogGrad.addColorStop(1, 'rgba(255,150,80,0)');

  /* ---------- game state ---------- */
  const PAL = [
    { body: '#e8e1cf', stripe: '#1f4e8c' },
    { body: '#dcd5c4', stripe: '#b3342b' },
    { body: '#cfd7de', stripe: '#d9801c' }
  ];
  let state = 'menu', t = 0, dist = 0, speed = 11, coins = 0, best = 0, overAt = -9, shake = 0, spawnZ = 40, safe = 0, newBest = false;
  try { best = +localStorage.getItem('railrush-best') || 0; } catch (e) { best = 0; }
  const P = { idx: 0, x: 0, y: 0, vy: 0, slide: 0, run: 0 };
  let objs = [], parts = [];

  const score = () => Math.floor(dist / 3) + coins * 10;

  function reset() {
    dist = 0; speed = 17; coins = 0; objs = []; parts = [];
    P.idx = 0; P.x = 0; P.y = 0; P.vy = 0; P.slide = 0;
    spawnZ = 34; safe = 0; newBest = false; shake = 0;
    fill();
  }
  function start() { reset(); state = 'play'; beep(520, 0.12, 'triangle', 0.06, 880); }

  function spawnRow() {
    const z = spawnZ;
    if (state === 'menu') { spawnZ += 30; return; }
    safe = Math.max(-1, Math.min(1, safe + pick([-1, 0, 0, 1])));
    const hard = Math.min(0.9, 0.5 + speed / 110);
    let maxLen = 0;
    for (let l = -1; l <= 1; l++) {
      if (l === safe) {
        const r = Math.random();
        if (r < 0.3) {
          const kind = Math.random() < 0.5 ? 'bar' : 'over';
          objs.push({ t: kind, l, z, len: 0.5 });
          if (kind === 'bar') for (let i = -1; i <= 1; i++) objs.push({ t: 'coin', l, z: z + i * 1.6 + 0.25, y: i === 0 ? 2.2 : 1.6, ph: rnd(0, 6) });
        } else if (r < 0.85) {
          for (let i = 0; i < 5; i++) objs.push({ t: 'coin', l, z: z + i * 1.8, y: 0.9, ph: rnd(0, 6) });
        }
      } else if (Math.random() < hard) {
        const r = Math.random();
        if (r < 0.4) {
          const len = pick([7, 9, 12, 15]);
          objs.push({ t: 'train', l, z, len, pal: pick(PAL) });
          maxLen = Math.max(maxLen, len);
        } else if (r < 0.7) objs.push({ t: 'bar', l, z, len: 0.5 });
        else objs.push({ t: 'over', l, z, len: 0.5 });
      }
    }
    spawnZ += Math.max(16, 14 + speed * 0.35) + maxLen;
  }
  function fill() { while (spawnZ < FAR + 10) spawnRow(); }

  function burst(x, y, color, n, power) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, 6.283), s = rnd(0.3, 1) * power;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - power * 0.3, life: rnd(0.35, 0.8), max: 0.8, c: color, s: rnd(2, 5) });
    }
  }

  function crash() {
    state = 'over'; overAt = t; shake = reduceMotion ? 0 : 0.5;
    const sc = score();
    if (sc > best) {
      best = sc; newBest = true;
      try { localStorage.setItem('railrush-best', String(best)); } catch (e) { /* ignore */ }
    }
    const p = proj(P.x, P.y + 1, ZP);
    burst(p[0], p[1], '#ff6b5a', 22, 260);
    burst(p[0], p[1], '#ffd23f', 12, 200);
    beep(160, 0.45, 'sawtooth', 0.08, 40);
  }

  function collide() {
    const h = P.slide > 0 ? 0.7 : 1.7;
    for (const o of objs) {
      if (o.t === 'coin') {
        if (o.taken) continue;
        if (Math.abs(o.z - ZP) < 0.8 && Math.abs(o.l * LANE - P.x) < 1.0 && o.y + 0.3 > P.y && o.y - 0.3 < P.y + h) {
          o.taken = true; coins++;
          const p = proj(o.l * LANE, o.y, o.z);
          burst(p[0], p[1], '#ffd23f', 7, 150);
          beep(988, 0.07, 'square', 0.04); setTimeout(() => beep(1480, 0.09, 'square', 0.04), 55);
        }
        continue;
      }
      if (o.z > ZP + 0.45 || o.z + o.len < ZP - 0.45) continue;
      if (Math.abs(o.l * LANE - P.x) >= 1.1) continue;
      let hit;
      if (o.t === 'bar') hit = P.y < 0.85;
      else if (o.t === 'over') hit = P.slide <= 0 || P.y > 0.2;
      else hit = P.y < 3;
      if (hit) { crash(); return; }
    }
  }

  function step(dt) {
    t += dt;
    if (state === 'play') speed = Math.min(44, 17 + dist / 90);
    else if (state === 'menu') speed = 11;
    else speed = Math.max(0, speed - 70 * dt);
    const mv = speed * dt;
    dist += mv; spawnZ -= mv;
    for (const o of objs) o.z -= mv;
    objs = objs.filter(o => !o.taken && o.z + (o.len || 0) > NEAR + 0.1);
    if (state !== 'over') fill();
    if (state !== 'over') {
      P.x += (P.idx * LANE - P.x) * Math.min(1, dt * 16);
      P.run += dt * (8 + speed * 0.28);
      if (P.y > 0 || P.vy > 0) {
        P.vy -= 55 * dt; P.y += P.vy * dt;
        if (P.y <= 0) { P.y = 0; P.vy = 0; }
      }
      if (P.slide > 0) P.slide -= dt;
    }
    if (state === 'play') collide();
    if (shake > 0) shake = Math.max(0, shake - dt * 1.4);
    for (const p of parts) { p.life -= dt; p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter(p => p.life > 0);
  }

  /* ---------- input ---------- */
  function act(a) {
    if (state !== 'play') {
      if (state === 'menu' || t - overAt > 0.6) start();
      return;
    }
    if (a === 'left') { if (P.idx > -1) { P.idx--; beep(520, 0.05, 'triangle', 0.03); } }
    else if (a === 'right') { if (P.idx < 1) { P.idx++; beep(520, 0.05, 'triangle', 0.03); } }
    else if (a === 'jump' || a === 'tap') {
      if (P.y <= 0.001) { P.vy = 14.5; P.y = 0.001; P.slide = 0; beep(300, 0.16, 'triangle', 0.06, 640); }
    } else if (a === 'down') {
      if (P.y > 0.001) { P.vy = -28; P.slide = 0.7; }
      else { P.slide = 0.7; beep(220, 0.2, 'sawtooth', 0.03, 110); }
    }
  }
  addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key;
    let a = null;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') a = 'left';
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') a = 'right';
    else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') a = 'jump';
    else if (k === 'ArrowDown' || k === 's' || k === 'S') a = 'down';
    else if (k === 'Enter') a = 'tap';
    if (a) { e.preventDefault(); act(a); }
  });
  let sx = 0, sy = 0, tracking = false, moved = false;
  cv.addEventListener('pointerdown', e => {
    sx = e.clientX; sy = e.clientY; tracking = true; moved = false;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  cv.addEventListener('pointermove', e => {
    if (!tracking) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
      moved = true;
      if (Math.abs(dx) > Math.abs(dy)) act(dx > 0 ? 'right' : 'left');
      else act(dy < 0 ? 'jump' : 'down');
      sx = e.clientX; sy = e.clientY;
    }
  });
  cv.addEventListener('pointerup', () => { if (tracking && !moved) act('tap'); tracking = false; });
  cv.addEventListener('pointercancel', () => { tracking = false; });

  /* ---------- drawing: world ---------- */
  function drawTrain(o) {
    const cx = o.l * LANE, x0 = cx - 0.95, x1 = cx + 0.95, y0 = 0.25, y1 = 3, z0 = o.z, z1 = o.z + o.len;
    if (z1 <= NEAR) return;
    const zc = Math.max(z0, NEAR), c = o.pal;
    let sxp = null;
    if (x1 < -0.01) sxp = x1; else if (x0 > 0.01) sxp = x0;
    if (sxp !== null) {
      poly([[sxp, y0, zc], [sxp, y1, zc], [sxp, y1, z1], [sxp, y0, z1]], shade(c.body, 0.62));
      poly([[sxp, 0.5, zc], [sxp, 0.85, zc], [sxp, 0.85, z1], [sxp, 0.5, z1]], shade(c.stripe, 0.8));
      for (let z = z0 + 1; z + 1.3 < z1; z += 2.4) {
        if (z < NEAR) continue;
        poly([[sxp, 1.7, z], [sxp, 2.55, z], [sxp, 2.55, z + 1.3], [sxp, 1.7, z + 1.3]], '#2a3350');
      }
    }
    poly([[x0, y1, zc], [x1, y1, zc], [x1, y1, z1], [x0, y1, z1]], shade(c.body, 0.8));
    if (z0 >= NEAR) {
      poly([[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], c.body);
      poly([[x0, y0, z0], [x1, y0, z0], [x1, 0.7, z0], [x0, 0.7, z0]], c.stripe);
      poly([[x0 + 0.15, 1.7, z0], [x1 - 0.15, 1.7, z0], [x1 - 0.15, 2.55, z0], [x0 + 0.15, 2.55, z0]], '#1b2238');
      poly([[cx - 0.5, 2.64, z0], [cx + 0.5, 2.64, z0], [cx + 0.5, 2.88, z0], [cx - 0.5, 2.88, z0]], '#ffb83a');
      const k = F / z0;
      [-0.6, 0.6].forEach(dx => {
        const p = proj(cx + dx, 1.0, z0);
        ctx.beginPath(); ctx.arc(p[0], p[1], 0.3 * k, 0, 6.283);
        ctx.fillStyle = 'rgba(255,240,180,.22)'; ctx.fill();
        ctx.beginPath(); ctx.arc(p[0], p[1], 0.13 * k, 0, 6.283);
        ctx.fillStyle = '#fff6c8'; ctx.fill();
      });
    }
  }

  function drawGate(o) {
    if (o.z < NEAR) return;
    const over = o.t === 'over', cx = o.l * LANE, z0 = o.z, z1 = o.z + o.len;
    const bx0 = cx - 0.9, bx1 = cx + 0.9;
    const by0 = over ? 1.0 : 0.35, by1 = over ? 2.3 : 0.85, postH = over ? 2.75 : 0.85;
    const A = over ? '#ffc83a' : '#e8402f', B = over ? '#1d1526' : '#f3ead8';
    [-1, 1].forEach(s => {
      const px = cx + s * 0.8;
      poly([[px - 0.07, 0, z0], [px + 0.07, 0, z0], [px + 0.07, postH, z0], [px - 0.07, postH, z0]], '#6a6a7e');
    });
    poly([[bx0, by1, z0], [bx1, by1, z0], [bx1, by1, z1], [bx0, by1, z1]], shade(A, 0.7));
    poly([[bx0, by0, z0], [bx1, by0, z0], [bx1, by1, z0], [bx0, by1, z0]], A);
    ctx.save();
    ctx.clip();
    const sl = (by1 - by0) * 0.6;
    for (let sx2 = bx0 - 1; sx2 < bx1; sx2 += 0.36) {
      poly([[sx2, by0, z0], [sx2 + 0.18, by0, z0], [sx2 + 0.18 + sl, by1, z0], [sx2 + sl, by1, z0]], B);
    }
    ctx.restore();
  }

  function drawCoin(o) {
    if (o.z < NEAR) return;
    const p = proj(o.l * LANE, o.y, o.z), r = 0.32 * F / o.z;
    const w = Math.max(0.22, Math.abs(Math.cos(t * 6 + o.ph)));
    ctx.beginPath(); ctx.ellipse(p[0], p[1], r * w, r, 0, 0, 6.283);
    ctx.fillStyle = '#ffc83a'; ctx.fill();
    ctx.lineWidth = Math.max(1, r * 0.18); ctx.strokeStyle = '#b8741a'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(p[0], p[1], r * w * 0.45, r * 0.45, 0, 0, 6.283);
    ctx.strokeStyle = 'rgba(184,116,26,.8)'; ctx.stroke();
  }

  function rr(x, y, w, h, r, fill) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
  }

  function drawPlayer() {
    const k = F / ZP, g = proj(P.x, P.y, ZP), gs = proj(P.x, 0, ZP);
    ctx.save();
    ctx.globalAlpha = 0.35 / (1 + P.y * 0.5);
    ctx.beginPath(); ctx.ellipse(gs[0], gs[1], 0.6 * k * (1 - Math.min(0.4, P.y * 0.15)), 0.17 * k, 0, 0, 6.283);
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(g[0], g[1]);
    ctx.scale(k, -k);
    ctx.lineWidth = 0.045; ctx.strokeStyle = '#14101f'; ctx.lineJoin = 'round';
    const sliding = P.slide > 0 && P.y <= 0.001, air = P.y > 0.001;
    if (sliding) ctx.scale(1.2, 0.52);
    if (state === 'over') ctx.rotate(-0.22);
    const ph = state === 'over' ? 0 : P.run, sw = Math.sin(ph);
    [-1, 1].forEach(s => {
      const lift = air ? 0.3 : Math.max(0, Math.sin(ph + (s > 0 ? 0 : Math.PI))) * 0.38;
      rr(s * 0.2 - 0.13, lift, 0.26, 0.82 - lift, 0.08, '#2e3a6b');
      rr(s * 0.2 - 0.16, lift, 0.32, 0.16, 0.06, '#f3ead8');
    });
    [-1, 1].forEach(s => {
      const ay = 0.78 + (air ? 0.2 : s * sw * 0.2);
      rr(s * 0.55 - 0.1, ay, 0.2, 0.6, 0.08, '#1aa593');
    });
    rr(-0.42, 0.75, 0.84, 0.72, 0.14, '#23c4b0');
    rr(-0.27, 0.82, 0.54, 0.56, 0.1, '#ffd23f');
    rr(-0.2, 1.3, 0.4, 0.14, 0.05, '#23c4b0');
    ctx.beginPath(); ctx.arc(0, 1.7, 0.27, 0, 6.283);
    ctx.fillStyle = '#2b1b17'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 1.82, 0.31, 0.17, 0, 0, 6.283);
    ctx.fillStyle = '#ff7a2f'; ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawScene() {
    // sky
    ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, HZ + 1);
    stars.forEach(s => { ctx.globalAlpha = s.a; ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.r, s.r); });
    ctx.globalAlpha = 1;
    ctx.fillStyle = sunGrad; ctx.fillRect(0, HZ - 150, W, 150);
    ctx.drawImage(skyline, -60 - P.x * 3, HZ - SKY_H + 1, SKY_W, SKY_H);

    // ground + track bed
    ctx.fillStyle = groundGrad; ctx.fillRect(0, HZ, W, H - HZ);
    poly([[-3.4, 0, NEAR], [3.4, 0, NEAR], [3.4, 0, FAR], [-3.4, 0, FAR]], '#2f2236');
    [-3.4, 3.2].forEach(x => poly([[x, 0, NEAR], [x + 0.2, 0, NEAR], [x + 0.2, 0, FAR], [x, 0, FAR]], '#4a3552'));

    // sleepers
    const S = 1.6, off = dist % S;
    for (let z = S - off; z < FAR; z += S) {
      if (z < NEAR) continue;
      ctx.globalAlpha = Math.min(1, (FAR - z) / 30);
      poly([[-3.3, 0, z], [3.3, 0, z], [3.3, 0, z + 0.45], [-3.3, 0, z + 0.45]], '#1a1222');
    }
    ctx.globalAlpha = 1;
    // rails
    [-LANE, 0, LANE].forEach(xl => [-0.6, 0.6].forEach(s => {
      poly([[xl + s - 0.07, 0, NEAR], [xl + s + 0.07, 0, NEAR], [xl + s + 0.07, 0, FAR], [xl + s - 0.07, 0, FAR]], '#8d96ab');
    }));
    ctx.fillStyle = fogGrad; ctx.fillRect(0, HZ - 2, W, 92);

    // poles
    const PS = 14, poff = dist % PS;
    const zs = [];
    for (let z = PS - poff; z < FAR; z += PS) if (z >= NEAR) zs.push(z);
    for (let i = zs.length - 1; i >= 0; i--) {
      const z = zs[i], k = F / z;
      ctx.globalAlpha = Math.min(1, (FAR - z) / 30);
      [-1, 1].forEach(s => {
        const x = s * 4.4, a = proj(x, 0, z), b = proj(x, 7.5, z), arm = proj(s * 3.2, 7.5, z);
        ctx.strokeStyle = '#3b2c48'; ctx.lineWidth = Math.max(1, 0.2 * k);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(arm[0], arm[1]); ctx.stroke();
        ctx.beginPath(); ctx.arc(arm[0], arm[1] + 0.2 * k, Math.max(1, 0.55 * k), 0, 6.283);
        ctx.fillStyle = 'rgba(255,190,110,.22)'; ctx.fill();
        ctx.beginPath(); ctx.arc(arm[0], arm[1] + 0.2 * k, Math.max(1, 0.2 * k), 0, 6.283);
        ctx.fillStyle = '#ffe2a8'; ctx.fill();
      });
    }
    ctx.globalAlpha = 1;

    // objects far -> near, player inserted at its depth
    const list = objs.filter(o => o.z < FAR).sort((a, b) => b.z - a.z);
    let drawn = false;
    for (const o of list) {
      if (!drawn && o.z < ZP) { drawPlayer(); drawn = true; }
      ctx.globalAlpha = Math.max(0, Math.min(1, (FAR - o.z) / 25));
      if (o.t === 'train') drawTrain(o);
      else if (o.t === 'coin') drawCoin(o);
      else drawGate(o);
    }
    ctx.globalAlpha = 1;
    if (!drawn) drawPlayer();

    parts.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s);
    });
    ctx.globalAlpha = 1;
  }

  /* ---------- drawing: HUD and screens ---------- */
  function text(str, x, y, font, color, align) {
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align || 'center';
    ctx.fillText(str, x, y);
  }

  function drawHud() {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 6;
    text('SCORE', 16, 28, '600 15px ' + BODY, '#d9cbe8', 'left');
    text(String(score()), 16, 58, '28px ' + DISPLAY, '#f3ead8', 'left');
    ctx.beginPath(); ctx.arc(W - 118, 44, 11, 0, 6.283);
    ctx.fillStyle = '#ffc83a'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#b8741a'; ctx.stroke();
    text(String(coins), W - 16, 54, '26px ' + DISPLAY, '#ffd23f', 'right');
    text('BEST ' + best, W - 16, 74, '600 15px ' + BODY, '#d9cbe8', 'right');
    ctx.restore();
  }

  function drawMenu() {
    ctx.fillStyle = 'rgba(14,9,26,.42)'; ctx.fillRect(0, 0, W, H);
    const x = 40, y = 92, w = W - 80, h = 120;
    ctx.fillStyle = '#1f3a6e'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
    ctx.strokeStyle = '#f3ead8'; ctx.lineWidth = 4; ctx.beginPath(); ctx.roundRect(x + 7, y + 7, w - 14, h - 14, 6); ctx.stroke();
    text('PLATFORM 3', W / 2, y + 36, '600 16px ' + BODY, '#cfe0ff');
    text('RAIL RUSH', W / 2, y + 88, '44px ' + DISPLAY, '#f3ead8');

    ctx.fillStyle = 'rgba(14,9,26,.66)'; ctx.beginPath(); ctx.roundRect(60, 262, W - 120, 168, 12); ctx.fill();
    text('←  →   switch track', W / 2, 303, '600 24px ' + BODY, '#f3ead8');
    text('↑   jump over barriers', W / 2, 337, '600 24px ' + BODY, '#f3ead8');
    text('↓   slide under yellow gantries', W / 2, 371, '600 24px ' + BODY, '#f3ead8');
    text('Swipe the same way on a phone', W / 2, 408, '500 18px ' + BODY, '#b9a9d0');

    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(t * 4);
    text('TAP OR PRESS SPACE', W / 2, 486, '22px ' + DISPLAY, '#ffd23f');
    ctx.globalAlpha = 1;
    if (best > 0) text('BEST ' + best, W / 2, 530, '600 20px ' + BODY, '#d9cbe8');
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(14,9,26,.72)'; ctx.fillRect(0, 0, W, H);
    text('CRASHED', W / 2, 220, '52px ' + DISPLAY, '#ff6b5a');
    text('SCORE', W / 2, 290, '600 18px ' + BODY, '#b9a9d0');
    text(String(score()), W / 2, 338, '44px ' + DISPLAY, '#f3ead8');
    text(newBest ? 'NEW BEST!' : 'BEST ' + best, W / 2, 380, newBest ? '24px ' + DISPLAY : '600 22px ' + BODY, newBest ? '#ffd23f' : '#d9cbe8');
    text(coins + ' coins collected', W / 2, 416, '600 20px ' + BODY, '#d9cbe8');
    if (t - overAt > 0.6) {
      ctx.globalAlpha = 0.65 + 0.35 * Math.sin(t * 4);
      text('TAP TO RUN AGAIN', W / 2, 490, '22px ' + DISPLAY, '#ffd23f');
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);
    drawScene();
    ctx.restore();
    if (state === 'play' || state === 'over') drawHud();
    if (state === 'menu') drawMenu();
    if (state === 'over') drawOver();
  }

  /* ---------- loop ---------- */
  reset();
  state = 'menu';
  objs = []; spawnZ = 40;
  let last = performance.now();
  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const n = Math.max(1, Math.ceil(dt / (1 / 90)));
    for (let i = 0; i < n; i++) step(dt / n);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
